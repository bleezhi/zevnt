name: Validate Zev themes

on:
  push:
    paths:
      - "media/themes/ZevOriginal/**"
      - "tools/validate_ztm.py"
      - ".github/workflows/validate-ztm.yml"
  pull_request:
    paths:
      - "media/themes/ZevOriginal/**"
      - "tools/validate_ztm.py"
      - ".github/workflows/validate-ztm.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Validate Zev Original
        run: python tools/validate_ztm.py media/themes/ZevOriginal
